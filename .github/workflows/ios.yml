name: iOS

# Builds the Swift engine and the app for the simulator.
#
# THIS WORKFLOW DOES NOT GATE THE WEB DEPLOY. Deploy runs on push to prod
# (deploy.yml) and never waits on this; a red iOS build stops nothing from
# shipping to the web. It exists to catch engine drift and compile breaks early,
# on the branch where the work actually lands.
#
# Why `dev` only, and why the paths filter:
#   * Waves merge straight to `dev` without PRs, so `pull_request` would never
#     fire.
#   * macOS minutes bill at 10x on a private repo. Running on `dev` AND
#     `pull_request` AND `prod` would build the same tested tree three times and
#     burn the included allowance — the symptom of running out is a job that
#     never starts, with zero steps and no logs.
on:
  push:
    branches: [dev]
    paths:
      - "ios/**"
      # The Swift engine is a second implementation of the shared vector format
      # and is held to byte-identical output; golden.json is generated FROM the
      # web serializer. So a change under src/shared can break Swift without
      # touching a single file in ios/.
      - "src/shared/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

# A burst of pushes should not run superseded macOS jobs to completion.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Swift engine tests
        working-directory: ios/KaleidoEngine
        run: swift test

      - name: Install XcodeGen
        # Auto-update alone costs 30-60s, billed at 10x.
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen

      - name: Generate the Xcode project
        # The .xcodeproj is gitignored and generated from project.yml.
        working-directory: ios
        run: xcodegen generate

      # What this runner image actually offers. Printed because the first run of
      # the gate below failed for want of an iOS 18.x runtime, and the useful
      # question — is there another Xcode sitting right there that ships one? —
      # could not be answered from the failure. Costs a second; turns a guess
      # into a measurement.
      - name: Inventory the toolchains and runtimes
        run: |
          echo "Xcodes present:"
          ls -d /Applications/Xcode*.app 2>/dev/null | sed 's/^/  /' || echo "  (none matched)"
          echo "Selected: $(xcodebuild -version | head -1)"
          echo "Runtimes visible to the selected Xcode:"
          xcrun simctl list runtimes | sed 's/^/  /'

      - name: Resolve a simulator UDID
        id: sim
        # NEVER pin the destination by device name. `name=iPhone 16` breaks
        # silently when GitHub refreshes the runner image: the device vanishes,
        # xcodebuild exits 70 listing only placeholders, and the failed run
        # still bills. Resolving at runtime is immune to that.
        #
        # This used to take the NEWEST runtime, and that was actively harmful.
        # StoreKit Testing is inoperative on the iOS 26.x simulator runtime:
        # every `SKTestSession` call fails `SKInternalErrorDomain Code=3`,
        # `Product.products(for:)` returns an empty array, and
        # `allTransactions()` / `AppStore.sync()` HANG rather than throw. The
        # same binary and the same `.storekit` file are 0-skipped on iOS 18.3
        # (measured both ways: 97 executed / 0 skipped on 18.3, 97 executed /
        # 15 skipped on 26.5 — and BOTH report `** TEST SUCCEEDED **` with
        # exit 0, which is why the skip count is asserted below rather than
        # trusted to the exit status).
        #
        # So prefer an 18.x runtime, and report whether we actually got one.
        run: |
          OUT=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys, re
          devices = json.load(sys.stdin)['devices']

          def version(rt):
              m = re.search(r'iOS-(\d+)-(\d+)', rt)
              return (int(m.group(1)), int(m.group(2))) if m else None

          cands = []
          for rt, devs in devices.items():
              v = version(rt)
              if v is None:
                  continue
              for d in devs:
                  if d.get('isAvailable') and d['name'].startswith('iPhone'):
                      cands.append((v, rt, d['udid'], d['name']))
          if not cands:
              sys.exit('no available iPhone simulator')

          preferred = [c for c in cands if c[0][0] == 18]
          pool, storekit = (preferred, 'yes') if preferred else (cands, 'no')
          v, rt, udid, name = max(pool)
          print(udid)
          print(storekit)
          sys.stderr.write(f'using {name} on {rt} (storekit-capable: {storekit})\n')
          ")
          echo "udid=$(printf '%s' "$OUT" | sed -n 1p)" >> "$GITHUB_OUTPUT"
          echo "storekit=$(printf '%s' "$OUT" | sed -n 2p)" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        working-directory: ios
        # The UDID goes through env rather than being interpolated straight into
        # the script. It comes from simctl, not from webhook input, but keeping
        # every `${{ }}` out of `run:` bodies is the habit that prevents the
        # injection bug rather than arguing about each case.
        env:
          DEST_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcodebuild build-for-testing \
            -scheme Kaleidoscope \
            -destination "id=$DEST_UDID"

      # The logic tests, and ONLY the logic tests.
      #
      # `build-for-testing` above compiles the XCTest bundles without running
      # them, so until now nothing in this repo ever EXECUTED an XCTest in CI —
      # the save-state resolution, the Plus/paywall state table and the StoreKit
      # payload construction were all verified on a laptop and nowhere else.
      #
      # The UI bundle stays out on purpose. It takes ~10 minutes, macOS bills at
      # 10x on a private repo, and its suites are device-class split: the dock
      # suites pass on a phone and fail on a pad, the rail suites do the reverse,
      # and the accessibility suite needs the phone's tab bar. No single
      # destination is green, so a UI run here would need two devices and would
      # still need a per-suite allow-list to mean anything.
      - name: Run the logic tests
        working-directory: ios
        env:
          DEST_UDID: ${{ steps.sim.outputs.udid }}
          STOREKIT_CAPABLE: ${{ steps.sim.outputs.storekit }}
        run: |
          set -o pipefail

          # If this runner cannot host StoreKit Testing, EXCLUDE that suite BY
          # NAME rather than let it skip. The distinction is the whole point: a
          # skip is invisible in a green run, an exclusion is written here in
          # the workflow and announced on every run. CI then proves everything
          # it CAN prove (82 of 97) and still fails on any skip it did not ask
          # for.
          #
          # Measured on GitHub's macos runner image: 15 Xcodes, ALL 26.x, and
          # only iOS 26.2 / 26.4 / 26.5 runtimes — so selecting an older Xcode,
          # the free fix, is not available. Downloading an iOS 18 runtime is the
          # alternative and costs real minutes at the 10x macOS multiplier.
          SKIP=""
          if [ "$STOREKIT_CAPABLE" != "yes" ]; then
            SKIP="-skip-testing:KaleidoscopeUnitTests/PlusStoreKitTests"
            echo "::warning::No iOS 18.x runtime here, so PlusStoreKitTests (15 tests) is EXCLUDED."
            echo "::warning::StoreKit Testing is inoperative on iOS 26.x. The Apple purchase path"
            echo "::warning::is therefore proven only on a developer machine, never in CI."
          fi

          xcodebuild test-without-building \
            -scheme Kaleidoscope \
            -destination "id=$DEST_UDID" \
            -only-testing:KaleidoscopeUnitTests $SKIP | tee /tmp/unit.log

          # `| tee` with pipefail so xcodebuild's exit code survives the pipe.
          # A bare pipe reports the exit status of `tee`, which is always 0 —
          # that is how a red suite gets announced as green.
          LINE=$(grep -E "Executed [0-9]+ tests" /tmp/unit.log | tail -1 || true)
          if [ -z "$LINE" ]; then
            echo "::error::No tests ran. A run that did not happen is not a passing run."
            exit 1
          fi
          echo "$LINE"

          SKIPPED=$(printf '%s' "$LINE" | sed -nE 's/.*with ([0-9]+) tests? skipped.*/\1/p')
          SKIPPED=${SKIPPED:-0}
          # Any skip at all is a failure now: the one known-unrunnable suite is
          # excluded above, so a skip means something ELSE quietly opted out.
          if [ "$SKIPPED" -gt 0 ]; then
            echo "::error::$SKIPPED test(s) skipped — a gate that ran nothing must not be green."
            echo "::error::PlusStoreKitTests is already excluded by name, so this is a new gap."
            exit 1
          fi
