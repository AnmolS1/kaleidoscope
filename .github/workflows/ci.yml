name: CI

# The web gates, on the branch where work actually lands.
#
# deploy.yml runs the same gates, but only on a push to prod. That is correct
# for a deploy — it must be self-gating, and must not trust a separate
# workflow's status — but on its own it means a whole release's worth of commits
# reaches prod having never been checked by CI, and the first real exercise of
# the e2e step is the run that also migrates D1 and deploys.
#
# So the gates run here too. Ubuntu bills at 1x, unlike the 10x macOS iOS job,
# which is why this one has no paths filter and that one does.
on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # ACTIONS ARE PINNED TO COMMIT SHAs, not to `@v4`. A major tag is mutable:
      # whoever controls the repo can move it, and every workflow in the world
      # picks the new code up on its next run with no diff anywhere to see. The
      # trailing comment is the release each SHA is, so bumping one stays a
      # readable change.
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # The Swift engine's parity test compares against
      # ios/.../Fixtures/golden.json, which is GENERATED from src/shared/vector.ts.
      # Change the web serializer without regenerating and the Swift test keeps
      # comparing Swift to a snapshot of the old web behaviour — and passes while
      # the two platforms hash the same drawing differently. That is not
      # hypothetical: S16 and S17 shipped web-only and went a day undetected
      # exactly this way. Regenerate here and fail on any diff.
      - name: Golden fixtures are up to date with the web serializer
        run: |
          npx vite-node ios/tools/gen-engine-fixtures.ts
          git diff --exit-code -- ios/KaleidoEngine/Tests/KaleidoEngineTests/Fixtures/golden.json \
            || { echo "::error::golden.json is stale. Run: npx vite-node ios/tools/gen-engine-fixtures.ts"; exit 1; }

      - run: npm run build

      # Kept byte-identical to the same step in deploy.yml. Everything in it is
      # public: Cloudflare's published always-pass Turnstile test keys, Google
      # values that are never exercised because e2e signs in through
      # /api/auth/test-login, and a SESSION_SECRET generated per run.
      - name: Write .dev.vars for the e2e dev server
        run: |
          cat > .dev.vars <<EOF
          GOOGLE_CLIENT_ID=e2e-not-used.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET=e2e-not-used
          SESSION_SECRET=$(openssl rand -hex 32)
          TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
          TURNSTILE_SITE_KEY=1x00000000000000000000AA
          PUBLIC_BASE_URL=http://localhost:5173
          GOOGLE_REDIRECT_URI=http://localhost:5173/api/auth/callback
          ALLOW_TEST_LOGIN=true
          EOF

      # The e2e dev server runs the Worker against a LOCAL miniflare D1, which on
      # a fresh runner has no schema at all. Without this the failure is badly
      # misleading: /api/auth/test-login answers 500 (D1_ERROR: no such table:
      # users), the specs only assert `res.ok()`, and four tests fail looking
      # exactly like the ALLOW_TEST_LOGIN bypass was switched off. Every test
      # that avoids D1 passes, which reinforces the wrong diagnosis.
      #
      # It does not show up locally because .wrangler/state persists a migrated
      # database from earlier work, so a dev box is never in the state CI starts
      # in every single time.
      - name: Apply D1 migrations to the local dev database
        run: npm run db:migrate:local

      - run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        # 🔴 REQUIRED, not optional (REVIEW S24).
        #
        # This comment used to claim a run without credentials "degrades rather
        # than breaks". It does not. The `ai` binding reaches real
        # infrastructure even under `vite dev`, so wrangler opens a remote
        # session and the dev server REFUSES TO START without them — the e2e
        # step then fails before a single test runs, and it is not obvious from
        # the output that credentials are the reason.
        #
        # The consequence worth knowing: a pull request from a FORK cannot see
        # these secrets, so this gate can never pass there. It is not a flake to
        # re-run; it is a structural limit of the binding.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
