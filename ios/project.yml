name: Kaleidoscope
options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: dev.ponderance
  createIntermediateGroups: true
packages:
  # Local Swift package: the native drawing engine (byte-exact vector interop).
  KaleidoEngine:
    path: KaleidoEngine
settings:
  base:
    # Simulator: ad-hoc sign ("-") — no Apple account needed, but (unlike disabling signing
    # entirely) it still injects the entitlements siriactionsd requires, so AppIntent configs
    # resolve. Device: automatic signing with the personal team for a real Apple Development cert.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: G2KBQH7KWT
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    # Widget extensions are simpler/more robust without the Preview debug-dylib split.
    ENABLE_DEBUG_DYLIB: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Kaleidoscope:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ponderance.kaleidoscope
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Sign in with Apple. Kept here (not added via Xcode) because the project is
    # XcodeGen-generated and the .xcodeproj is gitignored — a manual capability
    # would be wiped on regenerate. Anmol still enables it on the App ID in the
    # Developer portal (Part C) so device provisioning includes it.
    entitlements:
      path: App/Kaleidoscope.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kaleidoscope
        # Export compliance: the app uses only standard/exempt encryption (HTTPS),
        # so App Store Connect won't prompt on every submission. Declared here (not
        # just in Info.plist) so `xcodegen generate` can't drop it.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # Universal app: declare orientations so iPad doesn't warn ("must support all
        # orientations unless full screen"). iPhone: portrait + both landscapes; iPad: all four.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Deep link targets: widget tap (kaleidoscopewidget://p/<id>) and the
        # native Google auth callback (kaleidoscope://auth-callback#token&csrf).
        CFBundleURLTypes:
          - CFBundleURLName: dev.ponderance.kaleidoscope.widget
            CFBundleURLSchemes: [kaleidoscopewidget]
          - CFBundleURLName: dev.ponderance.kaleidoscope.auth
            CFBundleURLSchemes: [kaleidoscope]
        # DEBUG/local only: lets the Simulator reach `wrangler dev --remote` over loopback.
        # Production image URLs stay HTTPS; never ship a broader ATS exception.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - target: RandomWidget
      - package: KaleidoEngine
    # Shared scheme so `xcodebuild -scheme Kaleidoscope` works in CI / headless.
    scheme:
      testTargets: []
  RandomWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ponderance.kaleidoscope.RandomWidget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Kaleidoscope
        # Extensions are separate bundles and do NOT inherit the host app's ATS, so the
        # widget needs its own debug-only loopback exception for the wrangler-dev selection call.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
