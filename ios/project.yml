name: Kaleidoscope
options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: dev.ponderance
  createIntermediateGroups: true
packages:
  # Local Swift package: the native drawing engine (byte-exact vector interop).
  KaleidoEngine:
    path: KaleidoEngine
settings:
  base:
    # Simulator: ad-hoc sign ("-") — no Apple account needed, but (unlike disabling signing
    # entirely) it still injects the entitlements siriactionsd requires, so AppIntent configs
    # resolve. Device: automatic signing with the personal team for a real Apple Development cert.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: G2KBQH7KWT
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    # Widget extensions are simpler/more robust without the Preview debug-dylib split.
    ENABLE_DEBUG_DYLIB: NO
    MARKETING_VERSION: "1.2"
    # Fallback build number. The per-target postBuildScripts OVERRIDE this at
    # build/archive time with the git commit count (auto-increment). This literal is
    # only used if git is unavailable; keep it ≥ the last App Store Connect upload.
    CURRENT_PROJECT_VERSION: "55"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Kaleidoscope:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    postBuildScripts:
      - name: Set build number from git commit count
        basedOnDependencyAnalysis: false
        script: |
          # Auto build number at build/archive time: git commit count (monotonic),
          # floored so it never regresses. Degrades safely — if git or the plist is
          # unavailable it leaves $(CURRENT_PROJECT_VERSION) from project.yml intact.
          n=$(git -C "$PROJECT_DIR" rev-list --count HEAD 2>/dev/null || echo 0)
          [ "$n" -lt 55 ] && n=55
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          if [ -f "$plist" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $n" "$plist" && echo "build number -> $n"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ponderance.kaleidoscope
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Sign in with Apple. Kept here (not added via Xcode) because the project is
    # XcodeGen-generated and the .xcodeproj is gitignored — a manual capability
    # would be wiped on regenerate. Anmol still enables it on the App ID in the
    # Developer portal (Part C) so device provisioning includes it.
    # In-App Purchase (`dev.ponderance.kaleidoscope.plus`, non-consumable) is
    # deliberately NOT listed below. On iOS it is an App ID *service*, enabled in
    # the Developer portal, and Xcode's capability row writes nothing into the
    # entitlements file — StoreKit 2 links and runs without one. Inventing a key
    # here would still sign under the simulator's ad-hoc "-" identity and fail
    # only at device/archive signing. Anmol's side: the IAP on the App ID plus an
    # active Paid Applications agreement in ASC (T15 prerequisites).
    entitlements:
      path: App/Kaleidoscope.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kaleidoscope
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Export compliance: the app uses only standard/exempt encryption (HTTPS),
        # so App Store Connect won't prompt on every submission. Declared here (not
        # just in Info.plist) so `xcodegen generate` can't drop it.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # Universal app: declare orientations so iPad doesn't warn ("must support all
        # orientations unless full screen"). iPhone: portrait + both landscapes; iPad: all four.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Deep link targets: widget tap (kaleidoscopewidget://p/<id>) and the
        # native Google auth callback (kaleidoscope://auth-callback#token&csrf).
        CFBundleURLTypes:
          - CFBundleURLName: dev.ponderance.kaleidoscope.widget
            CFBundleURLSchemes: [kaleidoscopewidget]
          - CFBundleURLName: dev.ponderance.kaleidoscope.auth
            CFBundleURLSchemes: [kaleidoscope]
        # 🔴 THIS SHIPS IN RELEASE. It used to say "DEBUG/local only", which was
        # not true — xcodegen writes ONE Info.plist for every configuration, and
        # ATS keys are not among the settings Xcode will substitute per config
        # (a `$(VAR)` here produces a STRING where ATS wants a boolean, which
        # fails silently in the direction that breaks local dev). REVIEW.md
        # minor mI6.
        #
        # What it actually grants: cleartext HTTP to LOCAL hosts only —
        # loopback, .local, link-local. Never to the public internet. And no
        # Release code path can reach a local host: `Config.baseURL` and
        # `Config.webURL` are compile-time HTTPS constants and the only override
        # is inside `#if DEBUG`. `ConfigTests` asserts exactly that, so the
        # claim has a test behind it instead of a comment.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - target: RandomWidget
      - package: KaleidoEngine
    # Shared scheme so `xcodebuild -scheme Kaleidoscope` works in CI / headless.
    #
    # `storeKitConfiguration` binds Kaleidoscope.storekit to the RUN action, which
    # is what makes `Product.products(for:)` resolve — and therefore what makes
    # `product.displayPrice` non-nil — in a simulator with no App Store account.
    # It applies ONLY when Xcode launches the app: `simctl launch` ignores it, so
    # a screenshot run driven from the CLI sees `product == nil`. The unit tests
    # do not rely on it either; they drive `SKTestSession`, which loads the same
    # file out of the test bundle (see the resource entry on KaleidoscopeUnitTests).
    scheme:
      storeKitConfiguration: Kaleidoscope.storekit
      testTargets:
        - KaleidoscopeUnitTests
        - KaleidoscopeUITests
  # Logic tests against the app module. Added in 1.2 for the save flow: the save
  # sheet has eleven states resolved by a pure function, and a UI test cannot
  # reach them (a UI-test bundle runs out of process and cannot link the app), so
  # without this target "the sheet appeared" would be the only available
  # assertion — and it passes in all eleven.
  KaleidoscopeUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - UnitTests
      # `SKTestSession(configurationFileNamed:)` reads the .storekit file out of a
      # loaded bundle, so the file has to be COPIED INTO the test bundle — the
      # scheme's Run-action reference above does not put it there.
      - path: Kaleidoscope.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ponderance.kaleidoscope.unittests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Kaleidoscope
  # XCUITest target: asserts key VoiceOver labels exist on each screen.
  KaleidoscopeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ponderance.kaleidoscope.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Kaleidoscope
  RandomWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    postBuildScripts:
      - name: Set build number from git commit count
        basedOnDependencyAnalysis: false
        script: |
          # Auto build number at build/archive time: git commit count (monotonic),
          # floored so it never regresses. Degrades safely — if git or the plist is
          # unavailable it leaves $(CURRENT_PROJECT_VERSION) from project.yml intact.
          n=$(git -C "$PROJECT_DIR" rev-list --count HEAD 2>/dev/null || echo 0)
          [ "$n" -lt 55 ] && n=55
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          if [ -f "$plist" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $n" "$plist" && echo "build number -> $n"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ponderance.kaleidoscope.RandomWidget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Kaleidoscope
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Extensions are separate bundles and do NOT inherit the host app's ATS, so
        # the widget carries its own loopback exception for the wrangler-dev
        # selection call. Same correction as the app target above: this ships in
        # Release too, it permits cleartext to LOCAL hosts only, and the widget
        # reads the same `Config.baseURL` whose only non-HTTPS value is behind
        # `#if DEBUG`.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
